[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
liter-tokenizer = { path = "../crates/liter-tokenizer" }
liter-parser = { path = "../crates/liter-parser" }
liter-record = { path = "../crates/liter-record" }
liter-vdbe = { path = "../crates/liter-vdbe" }
liter = { path = "../crates/liter" }

[[bin]]
name = "fuzz_tokenizer"
path = "fuzz_targets/fuzz_tokenizer.rs"
test = false
doc = false

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc = false

[[bin]]
name = "fuzz_pager"
path = "fuzz_targets/fuzz_pager.rs"
test = false
doc = false

[[bin]]
name = "fuzz_btree"
path = "fuzz_targets/fuzz_btree.rs"
test = false
doc = false

[[bin]]
name = "fuzz_vdbe"
path = "fuzz_targets/fuzz_vdbe.rs"
test = false
doc = false

[[bin]]
name = "fuzz_full_db"
path = "fuzz_targets/fuzz_full_db.rs"
test = false
doc = false

[[bin]]
name = "fuzz_file_format"
path = "fuzz_targets/fuzz_file_format.rs"
test = false
doc = false
