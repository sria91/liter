[package]
name = "sqlite3"
description = "SQLite3-rs: unified Rust API facade (SQLite 3.53.x reimplementation)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sqlite3-alloc = { path = "../sqlite3-alloc" }
sqlite3-sync = { path = "../sqlite3-sync" }
sqlite3-unicode = { path = "../sqlite3-unicode" }
sqlite3-config = { path = "../sqlite3-config" }
sqlite3-vfs-mem = { path = "../sqlite3-vfs-mem" }
sqlite3-pager = { path = "../sqlite3-pager" }
sqlite3-btree = { path = "../sqlite3-btree" }
sqlite3-record = { path = "../sqlite3-record" }
sqlite3-schema = { path = "../sqlite3-schema" }
sqlite3-ast = { path = "../sqlite3-ast" }
sqlite3-tokenizer = { path = "../sqlite3-tokenizer" }
sqlite3-parser = { path = "../sqlite3-parser" }
sqlite3-codegen = { path = "../sqlite3-codegen" }
sqlite3-vdbe = { path = "../sqlite3-vdbe" }
sqlite3-functions = { path = "../sqlite3-functions" }
thiserror.workspace = true
parking_lot.workspace = true

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.92", optional = true }
getrandom = { version = "0.2", features = ["js"] }
