# Conformance manifest for official SQLite TCL suite execution.
# This file defines the current in-scope and excluded suites for Tier 3 tracking.

[metadata]
sqlite_version = "3.53.0"
mode = "tier3"
owner = "core-engine"

[smoke]
# Deterministic subset for PR checks.
include = ["main.test"]

[full_core]
# Broader core-engine coverage for scheduled and full CI lanes.
include = [
	"main.test",
	"alter.test",
	"delete.test",
	"expr.test",
	"index.test",
	"insert.test",
	"pragma.test",
	"table.test",
	"trans.test",
	"types.test",
	"update.test",
	"where.test",
]

[excluded_families]
# Explicitly excluded in this phase per project decision.
items = ["fts5", "json1", "rtree", "session"]

[temporary_skips]
# Add entries as needed:
# [[temporary_skips.item]]
# test = "some.test"
# reason = "brief rationale"
# owner = "team-or-person"
# expires = "2026-07-01"
