[workspace]
resolver = "2"
members = [
    "crates/liter-alloc",
    "crates/liter-sync",
    "crates/liter-unicode",
    "crates/liter-fmt",
    "crates/liter-config",
    "crates/liter-vfs",
    "crates/liter-vfs-unix",
    "crates/liter-vfs-win",
    "crates/liter-vfs-mem",
    "crates/liter-pager",
    "crates/liter-btree",
    "crates/liter-record",
    "crates/liter-tokenizer",
    "crates/liter-parser",
    "crates/liter-ast",
    "crates/liter-resolve",
    "crates/liter-optimizer",
    "crates/liter-codegen",
    "crates/liter-vdbe",
    "crates/liter-functions",
    "crates/liter-schema",
    "crates/liter-ffi",
    "crates/liter-fts5",
    "crates/liter-json",
    "crates/liter-rtree",
    "crates/liter",
    "tools/liter-shell",
    "benches",
    "tests/differential",
    "tests/format_compat",
    "tests/tcl_suite",
    "tests/oom",
    "crates/liter-session",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = []

[workspace.dependencies]
# Error handling
thiserror = "2"

# Logging
log = "0.4"

# Tokenizer
logos = "0.15"

# Data structures
arrayvec = "0.7"

# Concurrency
parking_lot = "0.12"

# Memory-mapped I/O
memmap2 = "0.9"
getrandom = "0.2"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Testing
proptest = "1"
arbitrary = { version = "1", features = ["derive"] }
tempfile = "3"

# C SQLite bindings (differential harness only)
rusqlite = "0.32"

# Bit flags
bitflags = "2"

# Internal crates
liter-alloc = { path = "crates/liter-alloc" }
liter-sync = { path = "crates/liter-sync" }
liter-unicode = { path = "crates/liter-unicode" }
liter-fmt = { path = "crates/liter-fmt" }
liter-config = { path = "crates/liter-config" }
liter-vfs = { path = "crates/liter-vfs" }
liter-vfs-unix = { path = "crates/liter-vfs-unix" }
liter-vfs-win = { path = "crates/liter-vfs-win" }
liter-vfs-mem = { path = "crates/liter-vfs-mem" }
liter-pager = { path = "crates/liter-pager" }
liter-btree = { path = "crates/liter-btree" }
liter-record = { path = "crates/liter-record" }
liter-tokenizer = { path = "crates/liter-tokenizer" }
liter-parser = { path = "crates/liter-parser" }
liter-ast = { path = "crates/liter-ast" }
liter-resolve = { path = "crates/liter-resolve" }
liter-optimizer = { path = "crates/liter-optimizer" }
liter-codegen = { path = "crates/liter-codegen" }
liter-vdbe = { path = "crates/liter-vdbe" }
liter-functions = { path = "crates/liter-functions" }
liter-schema = { path = "crates/liter-schema" }
liter-ffi = { path = "crates/liter-ffi" }
liter-fts5 = { path = "crates/liter-fts5" }
liter-json = { path = "crates/liter-json" }
liter-rtree = { path = "crates/liter-rtree" }
liter = { path = "crates/liter" }
